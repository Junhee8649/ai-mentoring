<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI 멘토링 활동 도구</title>
<!--
  학교급 × 차시로 분류한 활동 도구 목록.
  도구를 추가하면 아래 TOOLS 배열에 한 줄 넣는다.
  경로 규칙:  <학교급>/<차시번호>-<슬러그>/index.html
    학교급 — elem-junior(초저) · elem-senior(초고) · middle(중) · high(고)
-->
<style>
:root{
  --ink:#2E2A3A; --paper:#FFFDF7; --line:#E4D7B8;
  --purple:#7C5CFF; --purple-sh:#563BD1;
  --gold:#F0B429; --gold-deep:#B77F10;
}
*{box-sizing:border-box; margin:0; padding:0;}
body{
  font-family:"Jua","Gmarket Sans","Pretendard","Malgun Gothic","맑은 고딕",sans-serif;
  color:var(--ink); background:linear-gradient(180deg,#FFF3D6,#FFE2A8);
  min-height:100vh; padding:clamp(24px,5vh,64px) clamp(18px,4vw,40px);
}
.wrap{max-width:820px; margin:0 auto;}
h1{font-size:clamp(30px,5vw,54px); color:var(--purple-sh); letter-spacing:1px;}
.sub{font-size:clamp(15px,1.8vw,21px); color:#8A7550; margin:8px 0 30px; line-height:1.6;}
.group{margin-bottom:28px;}
.group > h2{
  font-size:clamp(15px,1.6vw,19px); color:#A8987C; letter-spacing:3px;
  border-bottom:3px solid var(--line); padding-bottom:6px; margin-bottom:14px;
}
a.tool{
  display:block; text-decoration:none; color:inherit;
  background:var(--paper); border:5px solid #fff; border-radius:22px;
  padding:16px 20px; box-shadow:0 8px 0 #DFCEA5; margin-bottom:12px;
  transition:transform .1s, box-shadow .1s;
}
a.tool:hover{transform:translateY(-3px); box-shadow:0 12px 0 #DFCEA5;}
a.tool:active{transform:translateY(4px); box-shadow:0 2px 0 #DFCEA5;}
a.tool .no{
  display:inline-block; background:var(--purple); color:#fff; border-radius:11px;
  padding:2px 12px; font-size:14px; box-shadow:0 3px 0 var(--purple-sh);
}
a.tool .nm{font-size:clamp(21px,2.4vw,30px); margin:8px 0 4px;}
a.tool .ds{font-size:clamp(13px,1.4vw,16px); color:#8A7550; line-height:1.55;}
.empty{
  border:4px dashed #DCC99F; border-radius:20px; padding:16px 20px;
  font-size:15px; color:#A8987C; line-height:1.6;
}
.note{
  margin-top:30px; background:#FFF0EC; border-left:5px solid #F0523F; border-radius:10px;
  padding:12px 16px; font-size:14.5px; line-height:1.6; color:#8C3A2C;
}
</style>
</head>
<body>
<div class="wrap">
  <h1>AI 멘토링 활동 도구</h1>
  <div class="sub">학교급과 차시별로 모아 둔 수업 진행용 도구입니다.<br>표준 프로그램의 활동을 그대로 쓰되, 교구가 없거나 진행이 어려운 부분만 새로 만들었습니다.</div>
  <div id="list"></div>
  <div class="note">
    <b>주의</b> — 도구 화면에는 멘토용 패널(정답·진행 메모)이 함께 있습니다. 아이들에게 주소를 직접 주지 마세요.
  </div>
</div>

<script>
/* 도구를 추가하려면 여기 한 줄 넣는다 */
const TOOLS = [
  { level:"elem-senior", no:"초고 · 10차시", name:"속지 마!",
    path:"elem-senior/10-biased-data/",
    desc:"「치우친 자료가 만든 실수」 전반부(0~22분). 말놀이 함정과 전설템 감별사로 '앞에서 뭘 받았느냐가 판단을 정한다'를 몸으로 겪게 한다." },
];

const LEVELS = [
  ["elem-junior","초등 저학년"],
  ["elem-senior","초등 고학년"],
  ["middle","중학교"],
  ["high","고등학교"],
];

const list = document.getElementById("list");
LEVELS.forEach(([key, label]) => {
  const mine = TOOLS.filter(t => t.level === key);
  if (!mine.length) return;                       // 아직 없는 학교급은 아예 안 그린다
  const g = document.createElement("div");
  g.className = "group";
  g.innerHTML = `<h2>${label}</h2>` + mine.map(t => `
    <a class="tool" href="${t.path}">
      <span class="no">${t.no}</span>
      <div class="nm">${t.name}</div>
      <div class="ds">${t.desc}</div>
    </a>`).join("");
  list.appendChild(g);
});

if (!TOOLS.length){
  list.innerHTML = `<div class="empty">아직 등록된 도구가 없습니다.</div>`;
}
</script>
</body>
</html>
